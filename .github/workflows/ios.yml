name: Build iOS (niepodpisany .ipa)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx cap add ios
      - run: node scripts/patch.js
      - run: npx cap sync ios
      - name: Build
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild archive $T -scheme App -configuration Release -destination "generic/platform=iOS" -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: skrzypce-ipa
          path: ios/App/app.ipa
